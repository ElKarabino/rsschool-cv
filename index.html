<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CV</title>
</head>
<body>
    <header class="header">
        <div class="wrapper">
            <div class="header_wrapper">
                <h1 class="title">Stanislau Karbanovich</h1>
                <img class="avatar" src="doggo.jpg" alt="dog">
            </div>
            <nav class="nav">
                <ul class="nav_list">
                    <li class="nav_item">Contacts</li>
                    <li class="nav_item">Skills</li>  
                    <li class="nav_item">Languages</li>
                    <li class="nav_item">Interests</li>
                    <li class="nav_item">Education</li>
                    <li class="nav_item">Experience</li>
                    <li class="nav_item">Code</li>
                </ul>
            </nav>
        </div>
    </header>
    <div class="wrapper">
        <div class="cv">
            <aside class="aside">
                <div class="contacts">
                    <h2 class="subtitle">Contacts</>
                </div>
                <div class="skills">
                    <h2 class="subtitle">Skills</h2>
                </div>
                <div class="languages">
                    <h2 class="subtitle">Languages</h2>
                </div>
                <div class="interests">
                    <h2 class="subtitle">Interests</h2>
                </div>
            </aside>
            <main class="main">
                <div class="education">
                    <h2 class="subtitle">Contacts</h2>
                </div>
                <div class="experience">
                    <h2 class="subtitle">Contacts</h2>
                </div>
                <div class="code">
                    <h2 class="subtitle">Contacts</h2>
                </div>
                <div class="projects">
                    <h2 class="subtitle">Contacts</h2>
                </div>
            </main>
        </div>
    </div>
    <footer class="footer">
        <div class="wrapper"></div>
    </footer>
</body>
</html>
